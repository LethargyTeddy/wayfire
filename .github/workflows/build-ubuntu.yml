name: Build Wayfire .deb on Debian sid

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb on Debian sid
    runs-on: ubuntu-latest
    container: debian:sid

    steps:
    - name: Install git
      run: |
        apt update
        apt install -y --no-install-recommends git ca-certificates

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        apt install -y --no-install-recommends \
          build-essential gettext \
          meson ninja-build pkg-config cmake \
          libwayland-dev wayland-protocols \
          libegl1-mesa-dev libgles2-mesa-dev libgbm-dev \
          libinput-dev libxkbcommon-dev \
          libxkbregistry-dev libxcb-icccm4-dev \
          libpixman-1-dev libcairo2-dev libglm-dev \
          libjpeg-dev libdrm-dev libsystemd-dev \
          libx11-xcb-dev libxcb-composite0-dev \
          libxcb-xinput-dev xwayland \
          nlohmann-json3-dev libdisplay-info-dev \
          hwdata libseat-dev libevdev-dev \
          libxml2-dev doctest-dev \
          libfreetype-dev libpango1.0-dev \
          libgtkmm-3.0-dev libglibmm-2.4-dev \
          libfmt-dev libxcb-ewmh-dev \
          libvulkan-dev glslang-tools \
          libxcb1-dev libxcb-composite0-dev \
          libxcb-render0-dev libxcb-res0-dev\
          libxcb-xfixes0-dev \
          libliftoff-dev libdisplay-info-dev libdrm-dev

    - name: Build and install to staging
      run: |
        # wayfire
        meson setup build --buildtype=release \
          --prefix=/usr \
          -Dxwayland=enabled \
          -Dvulkan_effects=true \
          -Duse_system_wlroots=disabled
        ninja -C build
        DESTDIR=$PWD/staging ninja -C build install

        # 把 wayfire 装好的 wf-config 同步到容器系统里
        # 这样 wcm 就能通过正常的 pkg-config 找到它
        cp -r staging/usr/* /usr/
        ldconfig

        # wcm（无需锁定版本）
        git clone https://github.com/WayfireWM/wcm.git
        cd wcm
        meson setup build --buildtype=release --prefix=/usr
        ninja -C build
        DESTDIR=$PWD/staging ninja -C build install
        cd ..
        cp -r wcm/staging/* staging/

    - name: Strip binaries
      run: |
        find staging -type f \( -name "*.so*" -o -perm -u+x \) \
          -exec strip --strip-unneeded {} + 2>/dev/null || true

    - name: Remove development files
      run: |
        rm -rf staging/usr/include
        rm -rf staging/usr/lib/x86_64-linux-gnu/pkgconfig

    - name: Remove libraries provided by system packages
      run: |
        find staging/usr/lib -name "*.so*" -type f | while read -r lib; do
          syspath="${lib#staging}"
          pkg=$(dpkg -S "$syspath" 2>/dev/null | cut -d: -f1)
          if [ -n "$pkg" ]; then
            echo "Removing $lib (provided by $pkg)"
            rm -f "$lib"
          fi
        done
        # 清理因删除文件而变成悬空的符号链接
        find staging/usr/lib -xtype l -delete

    - name: Generate DEBIAN/control
      run: |
        VERSION=$(meson introspect build --projectinfo \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
        ARCH=$(dpkg --print-architecture)
        INSTALLED_SIZE=$(du -sk staging/usr | cut -f1)

        DEPS=$(find staging -type f \( -perm -u+x -o -name "*.so*" \) \
          | while read f; do ldd "$f" 2>/dev/null; done \
          | grep "=> /" | awk '{print $3}' | sort -u \
          | while read lib; do
              dpkg -S "$lib" 2>/dev/null | cut -d: -f1
            done | sort -u | grep -v '^$' | paste -sd, -)

        mkdir -p staging/DEBIAN
        {
          echo "Package: wayfire"
          echo "Version: ${VERSION}"
          echo "Architecture: ${ARCH}"
          echo "Maintainer: LethargyTeddy <noreply@example.com>"
          echo "Installed-Size: ${INSTALLED_SIZE}"
          echo "Depends: ${DEPS}"
          echo "Section: x11"
          echo "Priority: optional"
          echo "Homepage: https://github.com/WayfireWM/wayfire"
          echo "Description: 3D Wayland compositor"
          echo " Wayfire is a 3D Wayland compositor aiming to be customizable"
          echo " and extensible, with a focus on lightweight and smooth animations."
        } > staging/DEBIAN/control

        echo "=== Generated control file ==="
        cat staging/DEBIAN/control

    - name: Build .deb
      run: |
        VERSION=$(meson introspect build --projectinfo \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
        ARCH=$(dpkg --print-architecture)
        dpkg-deb --build --root-owner-group staging \
          "wayfire_${VERSION}_${ARCH}.deb"
        ls -lh wayfire_*.deb

    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: wayfire-deb
        path: wayfire_*.deb
        if-no-files-found: error
        retention-days: 30
