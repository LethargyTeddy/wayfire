name: Build Wayfire on Debian sid

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build with GCC on Debian sid
    runs-on: ubuntu-latest
    container: debian:sid  # 关键：使用 Debian sid 容器

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        apt update
        apt install -y --no-install-recommends \
          meson ninja-build pkg-config \
          libwayland-dev wayland-protocols \
          libwlroots-0.20-dev \
          libegl1-mesa-dev libgles2-mesa-dev libgbm-dev \
          libinput-dev libxkbcommon-dev \
          libpixman-1-dev libcairo2-dev libglm-dev \
          libjpeg-dev libdrm-dev libsystemd-dev \
          libx11-xcb-dev libxcb-composite0-dev \
          libxcb-xinput-dev xwayland \
          nlohmann-json3-dev libdisplay-info-dev \
          hwdata libseat-dev libevdev-dev \
          libxml2-dev doctest-dev cmake \
          libfreetype-dev libpango1.0-dev

    - name: Build Wayfire (use system wlroots)
      run: |
        meson setup build --buildtype=release -Duse_system_wlroots=enabled
        ninja -C build

    - name: Install to staging directory
      run: |
        DESTDIR=$PWD/staging ninja -C build install

    - name: Strip binaries
      run: |
        find staging -type f \( -name "*.so*" -o -perm -u+x \) -exec strip --strip-unneeded {} + 2>/dev/null || true

    - name: Upload stripped install tree
      uses: actions/upload-artifact@v4
      with:
        name: wayfire-debian-sid
        path: staging/
        if-no-files-found: error
        retention-days: 30
